<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Target schema</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
  <link rel="stylesheet" href="/colors.css" />
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/nav.css" />
  <link rel="stylesheet" href="/modal.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="/hljs-theme.css" />
</head>
<body>
  <nav class="geomerge-nav">
    <a href="/" class="geomerge-brand">geomerge</a>
    <div class="geomerge-tabs">
      <a href="/" class="geomerge-tab tab-blue">Home</a>
      <a href="/setup/" class="geomerge-tab active tab-cyan">Setup</a>
      <a href="/collection/" class="geomerge-tab tab-peach">Collect</a>
      <a href="/prep/" class="geomerge-tab tab-purple">Prepare</a>
      <a href="/pipeline/" class="geomerge-tab tab-teal">Process</a>
      <a href="/validate/" class="geomerge-tab tab-pink">Validate</a>
    </div>
      <button type="button" class="theme-toggle" onclick="toggleTheme()" title="Toggle light/dark theme">
        <span class="theme-toggle-track">
          <span class="theme-toggle-knob">
            <span class="theme-toggle-icon theme-toggle-sun">☀️</span>
            <span class="theme-toggle-icon theme-toggle-moon">🌙</span>
          </span>
        </span>
      </button>
  </nav>
  <header>
    <div class="title-block">
      <h1 id="title">Target schema</h1>
    </div>
    <a href="/setup/" class="back-link">&larr; Setup</a>
  </header>

  <div class="danger-banner">
    Edits to this file aren't updated in the rest of the project automatically
    — best done at the start.
  </div>

  <div id="fields-body"></div>

  <button id="add-field-btn" type="button">+ Add field</button>

  <div class="save-row">
    <button id="save-btn">Save</button>
    <span id="save-status" class="meta"></span>
  </div>

  <footer class="geomerge-footer">
    <button type="button" id="footer-file-link" class="footer-file-link meta">editing: schema/ccnd.yaml</button>
    <span class="meta">&middot;</span>
    <span id="field-count" class="meta"></span>
  </footer>

  <div id="file-preview-modal" class="modal-overlay hidden">
    <div class="modal-panel">
      <div class="modal-header">
        <div class="modal-title-block">
          <h2 id="file-preview-title"></h2>
          <div id="file-preview-path" class="meta"></div>
        </div>
        <button id="file-preview-close" class="modal-close" type="button">&times;</button>
      </div>
      <pre id="file-preview-content" class="code-block hljs"></pre>
    </div>
  </div>

  <script src="/assets/vendor/highlightjs/highlight.min.js"></script>
  <script src="/file-preview.js"></script>
  <script src="schema.js"></script>
  <script>
    document.getElementById("footer-file-link").addEventListener("click", () => {
      openFilePreview("schema/ccnd.yaml", "api/schema/raw");
    });
    document.getElementById("file-preview-close").addEventListener("click", closeFilePreview);
    document.getElementById("file-preview-modal").addEventListener("click", (e) => {
      if (e.target.id === "file-preview-modal") closeFilePreview();
    });
  </script>
</body>
</html>
