<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>process</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
  <link rel="stylesheet" href="/colors.css" />
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/nav.css" />
  <link rel="stylesheet" href="/table.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="geomerge-nav">
    <a href="/" class="geomerge-brand">geomerge</a>
    <div class="geomerge-tabs">
      <a href="/" class="geomerge-tab tab-blue">Home</a>
      <a href="/setup/" class="geomerge-tab tab-lavender">Setup</a>
      <a href="/collection/" class="geomerge-tab tab-peach">Collect</a>
      <a href="/prep/" class="geomerge-tab tab-purple">Prepare</a>
      <a href="/pipeline/" class="geomerge-tab active tab-teal">Process</a>
      <a href="/validate/" class="geomerge-tab tab-pink">Validate</a>
    </div>
      <button type="button" class="theme-toggle" onclick="toggleTheme()" title="Toggle light/dark theme">
        <span class="theme-toggle-track">
          <span class="theme-toggle-knob">
            <span class="theme-toggle-icon theme-toggle-sun">☀️</span>
            <span class="theme-toggle-icon theme-toggle-moon">🌙</span>
          </span>
        </span>
      </button>
  </nav>
  <header>
    <label class="toggle">
      Filter:
      <select id="filter-mode">
        <option value="all" selected>All</option>
        <option value="complete">Complete</option>
        <option value="incomplete">Incomplete</option>
      </select>
    </label>
  </header>
  <div class="table-scroll">
    <table id="rows">
      <thead>
        <tr>
          <th>Source</th>
          <th>
            Process
            <button id="refresh-btn" class="refresh-btn" title="Refresh status">&#8635;</button>
          </th>
        </tr>
      </thead>
      <tbody id="rows-body"></tbody>
      <tfoot>
        <tr><td colspan="2"></td></tr>
      </tfoot>
    </table>
  </div>
  <footer class="geomerge-footer">
    <span id="progress" class="meta"></span>
  </footer>
  <script src="app.js"></script>
</body>
</html>
