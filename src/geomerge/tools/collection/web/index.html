<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>collect</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
  <link rel="stylesheet" href="/nav.css" />
  <link rel="stylesheet" href="/table.css" />
  <link rel="stylesheet" href="/modal.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="geomerge-nav">
    <a href="/" class="geomerge-brand">geomerge</a>
    <div class="geomerge-tabs">
      <a href="/" class="geomerge-tab tab-blue">Home</a>
      <a href="/collection/" class="geomerge-tab active tab-peach">Collect</a>
      <a href="/prep/" class="geomerge-tab tab-purple">Prepare</a>
      <a href="/pipeline/" class="geomerge-tab tab-teal">Process</a>
      <a href="/validate/" class="geomerge-tab tab-pink">Validate</a>
    </div>
  </nav>
  <header>
    <label class="toggle">
      Filter:
      <select id="filter-mode">
        <option value="all" selected>All</option>
        <option value="not_found">Not found</option>
        <option value="metadata_incomplete">Incomplete</option>
        <option value="metadata_complete">Complete</option>
        <option value="flagged">Flagged</option>
      </select>
    </label>
  </header>
  <div class="table-scroll">
  <table id="rows">
    <colgroup>
      <col style="width: 210px" />
      <col style="width: 140px" />
      <col style="width: 150px" />
      <col style="width: 260px" />
      <col style="width: 95px" />
      <col style="width: 145px" />
      <col style="width: 55px" />
      <col style="width: 220px" />
    </colgroup>
    <thead>
      <tr>
        <th>Provider</th>
        <th>Portal</th>
        <th>Actions</th>
        <th>Source URL</th>
        <th>Raw data</th>
        <th>Metadata</th>
        <th>Flag</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody id="rows-body"></tbody>
    <tfoot>
      <tr><td colspan="8"></td></tr>
    </tfoot>
  </table>
  </div>
  <footer class="geomerge-footer">
    <span id="checklist-path" class="meta"></span>
    <span id="progress" class="meta"></span>
    <button id="add-source-btn" type="button">+ Add provider</button>
  </footer>

  <div id="metadata-modal" class="modal-overlay hidden">
    <div class="modal-panel">
      <div class="modal-header">
        <h2 id="modal-title"></h2>
        <button id="modal-close" class="modal-close" type="button">&times;</button>
      </div>
      <div id="metadata-blocks"></div>
      <button id="add-another-source-btn" type="button" class="detect-btn">+ Add another source</button>
      <div class="modal-actions">
        <button id="modal-save">Save</button>
        <span id="modal-save-status" class="meta"></span>
      </div>
    </div>
  </div>

  <div id="add-source-modal" class="modal-overlay hidden">
    <div class="modal-panel">
      <div class="modal-header">
        <h2 id="add-source-title">Add provider</h2>
        <button id="add-source-close" class="modal-close" type="button">&times;</button>
      </div>
      <form id="add-source-form" class="edit-form"></form>
      <div id="add-source-error" class="error hidden"></div>
      <div class="modal-actions">
        <button id="add-source-save">Add</button>
        <span id="add-source-save-status" class="meta"></span>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
