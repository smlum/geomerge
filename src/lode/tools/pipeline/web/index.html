<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pipeline</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
  <link rel="stylesheet" href="/nav.css" />
  <link rel="stylesheet" href="/table.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="lode-nav">
    <a href="/" class="lode-brand">lode tools</a>
    <div class="lode-tabs">
      <a href="/" class="lode-tab tab-blue">Home</a>
      <a href="/collection/" class="lode-tab tab-peach">Collect</a>
      <a href="/prep/" class="lode-tab tab-purple">Prep</a>
      <a href="/pipeline/" class="lode-tab active tab-teal">Pipeline</a>
    </div>
  </nav>
  <header>
    <label class="toggle">
      Filter:
      <select id="filter-mode">
        <option value="all" selected>All</option>
        <option value="complete">Complete</option>
        <option value="incomplete">Incomplete</option>
      </select>
    </label>
  </header>
  <div class="table-scroll">
    <table id="rows">
      <thead>
        <tr>
          <th>Source</th>
          <th>
            Process
            <button id="refresh-btn" class="refresh-btn" title="Refresh status">&#8635;</button>
          </th>
          <th>Validation</th>
        </tr>
      </thead>
      <tbody id="rows-body"></tbody>
      <tfoot>
        <tr><td colspan="3"></td></tr>
      </tfoot>
    </table>
  </div>
  <footer class="lode-footer">
    <span id="progress" class="meta"></span>
  </footer>
  <script src="app.js"></script>
</body>
</html>
