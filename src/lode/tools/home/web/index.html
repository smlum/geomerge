<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>lode tools</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
  <link rel="stylesheet" href="/nav.css" />
  <link rel="stylesheet" href="/table.css" />
  <link rel="stylesheet" href="/modal.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="lode-nav">
    <a href="/" class="lode-brand">Open Data Pipeline</a>
    <div class="lode-tabs">
      <a href="/" class="lode-tab active tab-blue">Home</a>
      <a href="/collection/" class="lode-tab tab-peach">Collect</a>
      <a href="/prep/" class="lode-tab tab-purple">Prep</a>
      <a href="/pipeline/" class="lode-tab tab-teal">Pipeline</a>
    </div>
  </nav>
  <header>
    <label class="toggle">
      Filter:
      <select id="filter-mode">
        <option value="all" selected>All</option>
        <option value="complete">Complete</option>
        <option value="incomplete">Incomplete</option>
      </select>
    </label>
  </header>
  <div class="table-scroll">
    <table id="rows">
      <thead>
        <tr>
          <th rowspan="2">Source</th>
          <th colspan="2" class="group-header group-boundary">Collect</th>
          <th colspan="3" class="group-header group-boundary">Prep</th>
          <th colspan="2" class="group-header group-boundary">
            Pipeline
            <button id="refresh-btn" class="refresh-btn" title="Refresh status">&#8635;</button>
          </th>
        </tr>
        <tr>
          <th class="group-boundary">Metadata</th>
          <th>Raw</th>
          <th class="group-boundary">Map</th>
          <th>Preprocess</th>
          <th>Classify</th>
          <th class="group-boundary">Process</th>
          <th>Validation</th>
        </tr>
      </thead>
      <tbody id="rows-body"></tbody>
      <tfoot>
        <tr><td colspan="8"></td></tr>
      </tfoot>
    </table>
  </div>
  <footer class="lode-footer">
    <span id="summary" class="meta"></span>
  </footer>

  <div id="metadata-modal" class="modal-overlay hidden">
    <div class="modal-panel">
      <div class="modal-header">
        <h2 id="metadata-modal-title"></h2>
        <button id="metadata-modal-close" class="modal-close" type="button">&times;</button>
      </div>
      <pre id="metadata-modal-content" class="code-block"></pre>
      <div class="modal-actions">
        <a id="metadata-modal-edit" class="edit-btn" href="#">Edit</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
