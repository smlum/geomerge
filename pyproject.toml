[project]
name = "geomerge"
version = "0.1.0"
description = "Tools and pipeline for building geospatial datasets from open-data sources."
requires-python = ">=3.10"
dependencies = [
    "geopandas",
    "shapely",
    "pyproj",
    "pyyaml",
    "numpy",
    "pyarrow",
    "pandas",
    "flask",
    "python-dotenv",
]

[project.scripts]
geomerge = "geomerge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"geomerge.tools.column_mapping.web" = ["*.html", "*.js", "*.css"]
"geomerge.tools.collection.web" = ["*.html", "*.js", "*.css"]
"geomerge.tools.classification.web" = ["*.html", "*.js", "*.css"]
"geomerge.tools.home.web" = ["*.html", "*.js", "*.css", "assets/*", "assets/fonts/*"]
"geomerge.tools.prep.web" = ["*.html", "*.js", "*.css"]
"geomerge.tools.pipeline.web" = ["*.html", "*.js", "*.css"]
"geomerge.tools.validate.web" = ["*.html", "*.js", "*.css"]
